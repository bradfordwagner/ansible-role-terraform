---
# defaults file for terraform

# Terraform version to install
# check https://releases.hashicorp.com/terraform/index.json for newer releases
terraform_version: '1.16.1'

# system|local - drives the install dir, link dir, and become together
# (see vars/main.yml). system installs under /usr/local with become; local
# installs under {{ ansible_env.HOME }}/.local with no become.
terraform_scope: system

terraform_mirror: https://releases.hashicorp.com/terraform
